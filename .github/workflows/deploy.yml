name: Deploy

# Every push to main: run CI, then deploy the agent worker (Cloudflare Workers)
# and the module (SpacetimeDB), in that order. The browser client is not
# deployed: CI builds it against the hosted database and keeps it as the
# `web-dist` artifact, ready to upload to itch.io. Secrets and optional
# variables are listed in the README.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SPACETIMEDB_URI: ${{ vars.SPACETIMEDB_URI || 'https://maincloud.spacetimedb.com' }}
  SPACETIMEDB_DB: ${{ vars.SPACETIMEDB_DB || 'promptnite' }}

jobs:
  preflight:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    steps:
      - name: Required secrets are set
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=0
          for name in SPACETIMEDB_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID AGENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Set one of the repository secrets ANTHROPIC_API_KEY or OPENAI_API_KEY."
            missing=1
          fi
          exit "$missing"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      web-default-uri: ${{ vars.SPACETIMEDB_URI || 'https://maincloud.spacetimedb.com' }}
      web-default-db: ${{ vars.SPACETIMEDB_DB || 'promptnite' }}

  worker:
    name: Deploy agent worker
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    defaults:
      run:
        shell: bash
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPTNITE_PROVIDER: ${{ vars.PROMPTNITE_PROVIDER }}
          PROMPTNITE_MODEL: ${{ vars.PROMPTNITE_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
        run: |
          # The Worker's secrets, leaving out the ones that aren't set.
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          jq -n '{AGENT_SECRET: env.AGENT_SECRET, ANTHROPIC_API_KEY: env.ANTHROPIC_API_KEY, OPENAI_API_KEY: env.OPENAI_API_KEY}
                 | with_entries(select(.value != null and .value != ""))' > "$secrets_file"

          args=(--var "SPACETIMEDB_URI:$SPACETIMEDB_URI" --var "SPACETIMEDB_DB:$SPACETIMEDB_DB")
          for name in PROMPTNITE_PROVIDER PROMPTNITE_MODEL OPENAI_BASE_URL; do
            if [ -n "${!name}" ]; then args+=(--var "$name:${!name}"); fi
          done

          npx wrangler deploy "${args[@]}" --secrets-file "$secrets_file" | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$secrets_file"
      - name: Find the Worker's URL
        id: url
        env:
          AGENT_URL: ${{ vars.AGENT_URL }}
        run: |
          url="$AGENT_URL"
          if [ -z "$url" ]; then
            url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)"
          fi
          if [ -z "$url" ]; then
            echo "::error::Could not find the Worker's URL in wrangler's output. Set the repository variable AGENT_URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Agent worker: $url" >> "$GITHUB_STEP_SUMMARY"

  module:
    name: Publish module
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: ./.github/actions/setup-spacetime
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: module
          save-if: false
      - name: Publish
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
          AGENT_URL: ${{ needs.worker.outputs.url }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          spacetime login --token "$SPACETIMEDB_TOKEN"
          # No --delete-data: a schema change that would lose data fails here
          # and has to be published by hand.
          spacetime publish "$SPACETIMEDB_DB" --server "$SPACETIMEDB_URI" --module-path server \
            --yes=remote,skip-login,break-clients
          echo "Module: $SPACETIMEDB_DB on $SPACETIMEDB_URI" >> "$GITHUB_STEP_SUMMARY"
