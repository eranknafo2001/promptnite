[package]
name = "promptnite-server"
description = "SpacetimeDB module: lobby, round loop, agent calls and the authoritative match simulation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "2.15.*"
log = "0.4"
serde_json = "1"
promptnite-sim.workspace = true

# Only needed for the error type in the entropy hook, see src/entropy.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.3"
