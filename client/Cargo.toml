[package]
name = "promptnite"
description = "The game client. Runs natively and in the browser (wasm32-unknown-unknown)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
promptnite-bindings.workspace = true
# Only what a small 3D game needs; skipping audio, 2D, gltf scenes and bevy_ui
# keeps the wasm download smaller. `default_platform` includes WebGL2 support.
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "default_platform",
    "3d_bevy_render",
] }
bevy_egui = { version = "0.43", default-features = false, features = [
    "render",
    "default_fonts",
    "manage_clipboard",
] }
bevy_stdb = "0.14"

[target.wasm32-unknown-unknown.dependencies]
bevy_stdb = { version = "0.14", features = ["browser"] }
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "UrlSearchParams", "Navigator"] }
