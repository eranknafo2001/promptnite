<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Phones: no zooming (the game handles every touch itself), and the
         on-screen keyboard makes the page smaller instead of covering it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>promptnite</title>
    <!-- Where the client sends its logs: the agent worker's /logs route.
         Empty means nowhere. The deploy workflow fills it in. -->
    <meta name="promptnite-log-url" content="" />
    <!-- Trunk compiles the client to wasm and injects the loader here. -->
    <link data-trunk rel="rust" data-bin="promptnite" data-wasm-opt="s" />
    <!-- Served at ./assets, where Bevy's asset server looks in the browser. -->
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #121418;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Bevy sizes the canvas to its parent (fit_canvas_to_parent). */
      canvas {
        display: block;
        outline: none;
        /* Touches are the game's: no scrolling, zooming or text selection. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script>
      // Keep the game the size of what is actually visible. Where the
      // viewport setting above isn't enough (iOS), the on-screen keyboard
      // would otherwise cover the bottom of it, or scroll it off the top.
      const visible = window.visualViewport;
      if (visible) {
        const fit = () => {
          document.body.style.height = visible.height + "px";
          window.scrollTo(0, 0);
        };
        visible.addEventListener("resize", fit);
        visible.addEventListener("scroll", fit);
        fit();
      }
    </script>
  </body>
</html>
